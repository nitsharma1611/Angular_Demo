<div align="center">
    <h1>Role</h1>
    <h2 style="color: red;">{{ form.errorMessage }}</h2>
    <h2 style="color: green;">{{ form.successMessage }}</h2>
    <form (submit)="roleSave()">

        <table>

            <tr>
                <td>Name:</td>
                <td><input type="text" name="name" [(ngModel)]="form.data.name" placeholder="Enter UseName"></td>
                <td style="color:rgb(117, 106, 106);">{{form.inputerror.name}}</td>
            </tr>

            <tr>
                <td>Description:</td>
                <td><input type="description" name="description" [(ngModel)]="form.data.description"
                        placeholder="Enter Description"></td>
                <td style="color:rgb(117, 106, 106);">{{form.inputerror.description}}</td>
            </tr>

            <tr>
                <td></td>
                <td> <button type="submit">Save</button></td>
            </tr>

        </table>

    </form>

</div>
