    <div align="center">
    <h1>SignUp</h1>
    <form (submit)="signUp()">

        <table>

            <tr>
                <td>First Name:</td>
                <td><input type="text" name="fName" [(ngModel)]="form.data.fName"  placeholder="Enter FirstName"></td>
<td>{{form.errorMessage.fName}}</td>
            </tr>
<tr>
                <td>Last Name:</td>
                <td><input type="text" name="lName" [(ngModel)]="form.data.lName" placeholder="Enter last Name"></td>
            <td>{{form.errorMessage.lName}}</td>
            </tr>

<tr>
                <td>Login:</td>
                <td><input type="email" name="login" [(ngModel)]="form.data.login" placeholder="Enter login"></td>
            <td>{{form.errorMessage.login}}</td>
            </tr>

            <tr>
<td>Password:</td>
                <td><input type="password" name="password" [(ngModel)]="form.data.password" placeholder="Enter Password"></td>
            <td>{{form.errorMessage.password}}</td>
            </tr>

            <tr>
                <td></td>
               <td> <button type="submit">SignUp</button></td></tr>

        </table>

    </form>

</div>
